function openFilters(){
  const f = state.filters;
  const pairs = [...new Set(state.trades.map(t => t.pair))].sort();

  const body = `
    <label class="field"><span>Pair</span>
      <select id="flt_pair">
        <option value="">Any</option>
        ${pairs.map(p => `<option value="${esc(p)}" ${f.pair===p?'selected':''}>${esc(p)}</option>`).join('')}
      </select>
    </label>
    <label class="field"><span>Result</span>
      <select id="flt_result">
        <option value="">Any</option>
        <option value="WIN"  ${f.result==='WIN'?'selected':''}>Win</option>
        <option value="LOSS" ${f.result==='LOSS'?'selected':''}>Loss</option>
        <option value="BE"   ${f.result==='BE'?'selected':''}>Breakeven</option>
        <option value="OPEN" ${f.result==='OPEN'?'selected':''}>Open</option>
        <option value="NO_STOP" ${f.result==='NO_STOP'?'selected':''}>No stop loss</option>
      </select>
    </label>
    <div class="grid2">
      <label class="field"><span>From</span><input type="date" id="flt_from" value="${esc(f.from)}"></label>
      <label class="field"><span>To</span><input type="date" id="flt_to" value="${esc(f.to)}"></label>
    </div>
  `;
  const footer = `
    <button class="btn" id="clearFilters">Clear</button>
    <button class="btn primary" id="applyFilters" style="flex:1">Apply</button>
  `;
  const modal = openModal('Filters', body, footer);

  $('#clearFilters', modal).addEventListener('click', () => {
    state.filters = { q:'', pair:'', result:'', from:'', to:'' };
    closeModal(); render();
  });
  $('#applyFilters', modal).addEventListener('click', () => {
    state.filters.pair = $('#flt_pair', modal).value;
    state.filters.result = $('#flt_result', modal).value;
    state.filters.from = $('#flt_from', modal).value;
    state.filters.to = $('#flt_to', modal).value;
    closeModal(); render();
  });
}

/* ============================================================
   MODAL / TOAST / VIEWER HELPERS
   ============================================================ */
let currentModal = null;
function openModal(title, bodyHtml, footerHtml){
  closeModal();
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>${esc(title)}</h3>
        <button class="icon-btn" data-close-modal>✕</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', e => { if (e.target === wrap) closeModal(); });
  $$('[data-close-modal]', wrap).forEach(b => b.addEventListener('click', closeModal));
  currentModal = wrap;
  return wrap;
}
function closeModal(){ if (currentModal){ currentModal.remove(); currentModal = null; } }

function showToast(msg, actionText, action){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${actionText?`<button>${esc(actionText)}</button>`:''}`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  const remove = () => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); };
  if (actionText) el.querySelector('button').addEventListener('click', () => { action(); remove(); });
  setTimeout(remove, 5000);
}

function openViewer(src){
  const div = document.createElement('div');
  div.id = 'viewer'; div.className = 'show';
  div.innerHTML = `<button class="close">✕</button><img src="${src}"><div class="hint">Pinch to zoom · tap ✕ to close</div>`;
  document.body.appendChild(div);
  const img = div.querySelector('img');
  div.querySelector('.close').addEventListener('click', () => div.remove());
  div.addEventListener('click', e => { if (e.target === div) div.remove(); });
  attachPinch(img);
}

function attachPinch(img){
  let scale = 1, tx = 0, ty = 0;
  const pointers = new Map();
  let lastDist = 0;
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  img.addEventListener('pointerdown', e => { img.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pointers.size === 2){ const [a,b] = [...pointers.values()]; lastDist = Math.hypot(a.x-b.x, a.y-b.y); } });
  img.addEventListener('pointermove', e => { if (!pointers.has(e.pointerId)) return; const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pointers.size === 1 && scale > 1){ tx += e.clientX - prev.x; ty += e.clientY - prev.y; apply(); } else if (pointers.size === 2){ const [a,b] = [...pointers.values()]; const dist = Math.hypot(a.x-b.x, a.y-b.y); if (lastDist){ scale = Math.max(1, Math.min(6, scale * dist / lastDist)); apply(); } lastDist = dist; } });
  const up = e => { pointers.delete(e.pointerId); if (pointers.size < 2) lastDist = 0; if (scale === 1){ tx = 0; ty = 0; apply(); } };
  img.addEventListener('pointerup', up);
  img.addEventListener('pointercancel', up);
  img.addEventListener('dblclick', () => { scale = scale > 1 ? 1 : 2; if (scale === 1){ tx = 0; ty = 0; } apply(); });
}

/* ============================================================
   DATA EXPORT / IMPORT
   ============================================================ */
function download(filename, content, type){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
}

/* --- Export helpers (added: Web Share → Save As → text fallback) --- */
function shareSupported(){
  if (!navigator.share) return false;
  if (typeof File === 'undefined') return false;
  if (navigator.canShare){
    try {
      const f = new File(['{}'], 'x.json', { type: 'application/json' });
      return navigator.canShare({ files: [f] });
    } catch(e){ return false; }
  }
  return true;
}

async function tryShare(jsonStr, filename){
  if (!navigator.share || typeof File === 'undefined') return 'failed';
  try {
    const file = new File([jsonStr], filename, { type: 'application/json' });
    if (navigator.canShare && !navigator.canShare({ files: [file] })) return 'failed';
    await navigator.share({ files: [file], title: 'Forex Journal Backup' });
    return 'shared';
  } catch(e){
    if (e && e.name === 'AbortError') return 'cancelled';
    return 'failed';
  }
}

async function trySaveAs(jsonStr, filename){
  if (!window.showSaveFilePicker) return 'failed';
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: filename,
      types: [{ description: 'JSON backup', accept: { 'application/json': ['.json'] } }]
    });
    const writable = await handle.createWritable();
    await writable.write(jsonStr);
    await writable.close();
    return 'saved';
  } catch(e){
    if (e && e.name === 'AbortError') return 'cancelled';
    return 'failed';
  }
}

function openExportModal(jsonStr, filename){
  const canShare = shareSupported();
  const canSave = !!window.showSaveFilePicker;

  const body = `
    <p class="muted small" style="margin-bottom:8px;">Direct file saving is not available on this device. Copy the text below and paste it somewhere safe, or use one of the buttons.</p>
    <textarea id="exportJsonText" rows="10" readonly style="width:100%; font-family:ui-monospace,monospace; font-size:11px; resize:vertical;">${esc(jsonStr)}</textarea>
  `;

  let footer = '';
  if (canShare) footer += `<button class="btn" id="shareBtn">Share</button>`;
  if (canSave) footer += `<button class="btn" id="saveBtn">Save As</button>`;
  footer += `<button class="btn primary" id="copyJson" style="flex:1">Copy JSON</button>`;

  const modal = openModal('Export backup', body, footer);

  if (canShare){
    $('#shareBtn', modal).addEventListener('click', async () => {
      const r = await tryShare(jsonStr, filename);
      if (r === 'shared'){ closeModal(); showToast('Backup shared'); }
    });
  }
  if (canSave){
    $('#saveBtn', modal).addEventListener('click', async () => {
      const r = await trySaveAs(jsonStr, filename);
      if (r === 'saved'){ closeModal(); showToast('Backup saved'); }
    });
  }
  $('#copyJson', modal).addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(jsonStr);
      showToast('JSON copied to clipboard');
    } catch(e){
      const ta = $('#exportJsonText', modal);
      ta.removeAttribute('readonly');
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); showToast('JSON copied'); }
      catch(_){ showToast('Copy failed — select the text and copy manually'); }
      ta.setAttribute('readonly', '');
    }
  });
}

async function exportJSON(){
  const trades = [];
  for (const t of state.trades) {
    const copy = { ...t };
    if (t.thumb) {
      const full = await getImage(t.id);
      if (full) copy.screenshot = full;
    }
    trades.push(copy);
  }
  const data = { version: 8, exportedAt: new Date().toISOString(), trades, settings: state.settings };
  const jsonStr = JSON.stringify(data, null, 2);
  const filename = 'forex-journal-backup.json';

  /* 1. Web Share API (Android share sheet — send to Telegram, Drive, etc.) */
  if (navigator.share) {
    const r = await tryShare(jsonStr, filename);
    if (r === 'shared'){ showToast('Backup shared'); return; }
    if (r === 'cancelled') return;
  }

  /* 2. File System Access API — Save As, choose folder */
  if (window.showSaveFilePicker) {
    const r = await trySaveAs(jsonStr, filename);
    if (r === 'saved'){ showToast('Backup saved'); return; }
    if (r === 'cancelled') return;
  }

  /* 3. Text + Copy fallback */
  openExportModal(jsonStr, filename);
}

function exportCSV(){
  const rows = [['Date','Pair','Direction','Entry','StopLoss','TakeProfit','Exit','LotSize','Pips','Result','R','%','MoneyResult','Notes']];
  for (const t of state.trades){
    const c = state.calcMap[t.id] || calcTrade(t, 0);
    rows.push([
      t.dateTime, t.pair, c.direction, t.entry, t.stopLoss, t.takeProfit, t.exit, t.lotSize,
      c.pips, c.result, c.r, c.pct, c.moneyResult, (t.notes||'').replace(/\r?\n/g, ' ')
    ]);
  }
  const csv = rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n');
  download('trades.csv', csv, 'text/csv');
  showToast('CSV downloaded');
}
async function importJSON(){
  const inp = document.createElement('input');
  /* accept tweaked to ".json,application/json" so Android file pickers show .json files */
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.trades)) throw new Error('bad file');
        if (!confirm(`Import ${data.trades.length} trades? This will REPLACE your current data.`)) return;
        
        await clearImages();
        
        const newTrades = [];
        for (const t of data.trades) {
          const nt = { ...t };
          if (t.screenshot) {
            await saveImage(nt.id, t.screenshot);
            nt.thumb = await createThumb(t.screenshot);
            delete nt.screenshot;
          }
          newTrades.push(nt);
        }
        
        state.trades = newTrades;
        state.settings = Object.assign(defaultSettings(), data.settings || {});
        save(); render(); showToast('Data imported');
      } catch(e){ alert('Could not read that backup file.'); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function onViewClick(e){
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;

  if (a === 'add-trade')      { openTradeForm(); return; }
  if (a === 'open-trade')     { openTradeDetail(btn.dataset.id); return; }
  if (a === 'edit-trade')     { openTradeForm(btn.dataset.id); return; }
  if (a === 'delete-trade')   { deleteTrade(btn.dataset.id); return; }
  if (a === 'toggle-week')    {
    const wk = btn.dataset.week;
    const open = state.tradesExpanded[wk] !== false;
    state.tradesExpanded[wk] = !open;
    render(); return;
  }
  if (a === 'toggle-deeper')  { state.deeperAnalysisOpen = !state.deeperAnalysisOpen; render(); return; }
  if (a === 'dash-prev')      { state.dashRef = shiftPeriod(state.dashRef, state.dashPeriod, -1); render(); return; }
  if (a === 'dash-next')      { state.dashRef = shiftPeriod(state.dashRef, state.dashPeriod,  1); render(); return; }
  if (a === 'set-period')     { state.dashPeriod = btn.dataset.period; render(); return; }
  if (a === 'equity-mode')    { state.equityMode = btn.dataset.mode; render(); return; }
  if (a === 'open-filters')   { openFilters(); return; }
  if (a === 'cal-prev')       { state.calRef = addMonths(state.calRef, -1); state.selectedDay = null; render(); return; }
  if (a === 'cal-next')       { state.calRef = addMonths(state.calRef,  1); state.selectedDay = null; render(); return; }
  if (a === 'cal-day')        { state.selectedDay = state.selectedDay === btn.dataset.day ? null : btn.dataset.day; render(); return; }
  if (a === 'export-json')    { exportJSON(); return; }
  if (a === 'export-csv')     { exportCSV(); return; }
  if (a === 'import-json')    { importJSON(); return; }
  if (a === 'toggle-theme')   { state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark'; save(); render(); return; }
  if (a === 'add-pip-row')    {
    const name = ($('#newPairName')?.value || '').toUpperCase().trim();
    const size = Number($('#newPairSize')?.value);
    if (!name || !size) { alert('Enter a pair name and a pip size, e.g. GBPJPY and 0.01'); return; }
    state.settings.pipSizes[name] = size;
    save(); render(); return;
  }
  if (a === 'load-samples')   {
    if (state.trades.length && !confirm(`Add sample trades to your current data?`)) return;
    state.trades = state.trades.concat(buildSampleTrades());
    save(); render(); showToast('Sample trades loaded');
    return;
  }
  if (a === 'clear-all')      {
    if (confirm('Delete ALL trades and reset settings to defaults?')){
      state.trades = []; 
      state.settings = defaultSettings(); 
      save(); 
      clearImages(); 
      render();
    }
    return;
  }
  if (a === 'add-cf') {
    const type = $('#cfType').value;
    const amtStr = $('#cfAmount').value.replace(',', '.').trim();
    const amt = Number(amtStr);
    const date = $('#cfDate').value;
    if (!amtStr || isNaN(amt) || !date) { alert('Enter a valid amount and date.'); return; }
    if (!state.settings.cashFlows) state.settings.cashFlows = [];
    state.settings.cashFlows.push({ id: 'cf_'+Date.now(), type, amount: amt, dateTime: date });
    save(); render(); return;
  }
  if (a === 'del-cf') {
    if (!confirm('Delete this cash flow?')) return;
    state.settings.cashFlows = state.settings.cashFlows.filter(x => x.id !== btn.dataset.id);
    save(); render(); return;
  }
}

function onViewInput(e){
  const inp = e.target;
  if (inp.id === 'searchInput'){
    state.filters.q = inp.value;
    renderPreservingFocus();
  }
}

function onViewChange(e){
  const inp = e.target;
  const key = inp.dataset.setting;
  if (!key) return;

  if (key.startsWith('pipSizes.')){
    const pair = key.slice('pipSizes.'.length);
    const n = Number(inp.value);
    if (!isFinite(n) || n <= 0){ delete state.settings.pipSizes[pair]; }
    else { state.settings.pipSizes[pair] = n; }
    save(); render(); return;
  }

  if (key === 'theme' || key === 'currency'){ state.settings[key] = inp.value; }
  else {
    const n = Number(inp.value);
    state.settings[key] = isNaN(n) ? inp.value : n;
  }
  save(); render();
}

function wireGlobal(){
  document.getElementById('bottomNav').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    state.tab = b.dataset.tab;
    state.selectedDay = null;
    render();
    window.scrollTo(0, 0);
  });

  document.getElementById('fab').addEventListener('click', () => openTradeForm());

  const view = document.getElementById('view');
  view.addEventListener('click', onViewClick);
  view.addEventListener('input', onViewInput);
  view.addEventListener('change', onViewChange);

  let t = null;
  window.addEventListener('resize', () => {
    if (state.tab !== 'dashboard') return;
    clearTimeout(t);
    t = setTimeout(() => {
      const cv = document.getElementById('equityChart');
      if (cv) drawEquityChart(cv);
    }, 150);
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  await initDB();
  const loaded = load();
  state = {
    trades: loaded.trades,
    settings: loaded.settings,
    tab: 'dashboard',
    dashPeriod: 'week',
    dashRef: new Date(),
    equityMode: 'pct',
    calRef: new Date(),
    selectedDay: null,
    tradesExpanded: {},
    deeperAnalysisOpen: false,
    filters: { q:'', pair:'', result:'', from:'', to:'' },
    calcMap: {},
    currentBalance: 0,
    totalPL: 0,
  };
  document.documentElement.dataset.theme = state.settings.theme;
  await migrateImages();
  wireGlobal();
  render();
  
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist();
  }
}

init();
